<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#15454a" />
    <link rel="icon" href="data:," />
    <title>Mackerel Mail · Harbour Post</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/build/three.module.js",
          "three/addons/": "../../vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <svg class="defs" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="fish" viewBox="0 0 70 44">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M4 25 0 10l15 7C24 4 46 3 65 17l5 5-6 5c-16 13-37 12-49 0L0 36zm47-7a2.7 2.7 0 1 0 5.4 0 2.7 2.7 0 0 0-5.4 0zM25 15l-3 9 3 1 3-11zm8-2-4 13 3 1 4-15zm8 0-4 14 3 1 4-15z"
          />
        </symbol>
        <symbol id="letter" viewBox="0 0 32 24">
          <path
            d="M2 2h28v20H2zM3 3l13 11L29 3M3 20l9-9m17 9-9-9"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linejoin="round"
          />
        </symbol>
        <symbol id="sound" viewBox="0 0 24 24">
          <path
            d="M3 9h4l5-4v14l-5-4H3zm13-2q5 5 0 10m3-13q8 8 0 16"
            stroke="currentColor"
            stroke-width="1.8"
            fill="none"
            stroke-linejoin="round"
          />
        </symbol>
      </defs>
    </svg>
    <canvas id="world" aria-label="The three-dimensional fishing harbour"></canvas>
    <main id="title">
      <div class="ticket">
        <div class="ticketInner">
          <div class="mast"><span class="wings">≋</span> HARBOUR POST <span class="wings">≋</span></div>
          <div class="edition"><span>COASTAL DIVISION</span><span>EST. 1968</span></div>
          <h1>
            Mackerel<br /><em>Mail</em
            ><span class="postmark"
              ><svg><use href="#fish" /></svg
            ></span>
          </h1>
          <p class="tag">A small cat with a very important postbag.</p>
          <button id="start">Start my round <span>→</span></button>
          <div class="hint">OR PRESS <kbd>ENTER</kbd></div>
        </div>
        <div class="airmail"></div>
      </div>
    </main>
    <div id="brand">
      <svg><use href="#fish" /></svg><span>HARBOUR POST</span>
    </div>
    <div id="hud" hidden>
      <div class="route-card">
        <div class="eyebrow" id="routeNo"></div>
        <strong id="routeName"></strong><span id="objective"></span>
      </div>
      <div class="collect">
        <svg><use href="#fish" /></svg><b id="count">0 / 3</b>
      </div>
    </div>
    <div id="tools">
      <button id="audio" title="Toggle sound (M)" aria-label="Toggle sound">
        <svg><use href="#sound" /></svg></button
      ><button id="pause" aria-label="Pause" title="Pause (Esc)" hidden>Ⅱ</button>
    </div>
    <div id="maplabel" hidden></div>
    <div id="speech" hidden></div>
    <div id="toast" role="status"></div>
    <div id="keybar" hidden>
      <span><kbd>W A S D</kbd> Move</span><span><kbd>SPACE</kbd> Pounce</span><span><kbd>E</kbd> Meow</span>
    </div>
    <div id="touch" hidden>
      <div id="stick"><i></i></div>
      <div><button id="call">Meow</button><button id="leap">Pounce</button></div>
    </div>
    <div id="veil" hidden>
      <section id="modal" class="paper">
        <div class="airmail"></div>
        <div class="inside">
          <div class="eyebrow" id="modalLabel"></div>
          <h2 id="modalTitle"></h2>
          <div id="modalBody"></div>
          <div id="imprint" hidden aria-hidden="true">
            <b>HARBOUR POST</b><svg><use href="#fish" /></svg><span id="sealTown"></span>
          </div>
          <div id="actions"></div>
        </div>
      </section>
    </div>
    <script type="module" src="game.js"></script>
  </body>
</html>
